name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The domain crates are free of platform APIs, so they run anywhere. This is
  # where the detection, deployment and rollback guarantees are checked.
  core:
    name: Domain crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # The Tauri crate needs WebView2, so it only builds on the target platform.
  app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The Linux job cannot see anything behind `cfg(windows)` — the DXGI
      # adapter lookup and the credential store both live there.
      - name: Lints for the Windows-only code
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build installer
        run: pnpm tauri build

      - name: Report bundle size
        shell: pwsh
        run: |
          # Footprint is a stated goal, so keep it visible on every build.
          Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.exe |
            ForEach-Object { "{0,-48} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: sb-mod-manager-windows
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
