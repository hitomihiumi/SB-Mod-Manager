name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The domain crates are free of platform APIs, so they run anywhere. This is
  # where the detection, deployment and rollback guarantees are checked.
  core:
    name: Domain crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # The virtual file system end to end on real Windows: the launcher starts a
  # stand-in for the game under the hook and checks what it saw. Built the way
  # the app embeds the hook — release, static C runtime — so this is the DLL
  # users get, not a debug cousin of it.
  vfs:
    name: Virtual file system on Windows
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: vfs

      - name: Build the hook, launcher and probe
        run: cargo build --release -p sbmm-vfs-hook -p sbmm-vfs --examples --lib

      - name: Run the game stand-in under the virtual file system
        shell: pwsh
        run: |
          # Next to each other, as the launcher expects; the run folder is
          # outside the checkout so nothing the test writes can leak into it.
          $bin = "$env:RUNNER_TEMP\vfs-bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item target\release\sbmm_vfs_hook.dll, `
                    target\release\examples\vfs_probe.exe, `
                    target\release\examples\vfs_launch.exe $bin
          & "$bin\vfs_launch.exe" "$env:RUNNER_TEMP\vfs-run"
          exit $LASTEXITCODE

  # The Tauri crate needs WebView2, so it only builds on the target platform.
  app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The Linux job cannot see anything behind `cfg(windows)` — the DXGI
      # adapter lookup and the credential store both live there.
      - name: Lints for the Windows-only code
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The bundle carries updater artifacts, which tauri refuses to produce
      # unsigned. A throwaway key is generated per run rather than handing CI
      # the real one: the signing path still gets exercised, and nothing this
      # job builds is ever offered as an update.
      - name: Generate a throwaway signing key
        shell: pwsh
        run: |
          # No -p: PowerShell drops an empty string argument, so passing one
          # leaves --password with nothing after it and the CLI refuses.
          # --ci already means "do not prompt", which gives an unprotected key.
          pnpm tauri signer generate --ci -w "$env:RUNNER_TEMP/ci.key" -f
          # The key file is one line of base64, so it goes into the
          # environment as-is; the trim only guards a trailing newline.
          $key = (Get-Content -Raw "$env:RUNNER_TEMP/ci.key").Trim()
          "TAURI_SIGNING_PRIVATE_KEY=$key" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        run: pnpm tauri build

      - name: Report bundle size
        shell: pwsh
        run: |
          # Footprint is a stated goal, so keep it visible on every build.
          Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.exe |
            ForEach-Object { "{0,-48} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: sb-mod-manager-windows
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
