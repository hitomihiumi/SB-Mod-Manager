name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    # 03:00 UTC, from the default branch. Skipped when nothing landed that day.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Publish as the rolling nightly prerelease instead of a tagged release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A nightly build of unchanged code is pure waste, so check first.
  decide:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      nightly: ${{ steps.check.outputs.nightly }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "build=true"    >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "nightly=${{ inputs.nightly }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled: only worth it if the default branch moved since the
          # last nightly. Compared with the commit the nightly tag points at
          # rather than "the last 24 hours", because scheduled runs start
          # hours late and irregularly, and a commit landing between two of
          # them was never built.
          head=$(git rev-parse HEAD)
          built=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" || true)
          echo "default branch: $head, last nightly: ${built:-none}"
          if [ "$head" != "$built" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "nightly=true" >> "$GITHUB_OUTPUT"

  build:
    name: Windows installer
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Nightlies always come off the default branch, whatever triggered them.
          ref: ${{ needs.decide.outputs.nightly == 'true' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The installer takes its version from package.json, and the in-app
      # updater compares that against what it is running. A tag that disagrees
      # with package.json would publish fine and then never be offered as an
      # update — a release that looks complete and does nothing. Cheaper to
      # refuse here than to work out later why nobody got it.
      - name: Check the tag matches the version being built
        if: needs.decide.outputs.nightly != 'true'
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version."
            echo "Bump the version in package.json and tag it v$version, or tag this commit v$version."
            exit 1
          fi
          echo "tag $tag matches package.json $version"

      # A nightly built from the same package.json as the last stable release
      # carried the same version, so the in-app updater — which only offers
      # a newer version — never offered it. A nightly is the next patch
      # version as a prerelease, stamped with the build time: newer than the
      # stable release it grew from, older than the next one, and each newer
      # than the last.
      - name: Give the nightly a version of its own
        if: needs.decide.outputs.nightly == 'true'
        id: nightly
        shell: bash
        run: |
          version=$(node -e '
            const pkg = require("./package.json");
            const [major, minor, patch] = pkg.version.split("-")[0].split(".").map(Number);
            const stamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 12);
            pkg.version = `${major}.${minor}.${patch + 1}-nightly.${stamp}`;
            require("fs").writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(pkg.version);
          ')
          echo "nightly version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # One rolling prerelease, replaced rather than added to: reusing the old
      # release kept its first publication date, so it sorted as months old,
      # and kept every installer it ever had beside the new one.
      - name: Replace the previous nightly
        if: needs.decide.outputs.nightly == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --repo "${{ github.repository }}" || echo "no previous nightly release"
          git tag -f nightly
          git push -f origin nightly

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the build produces no signature and the in-app
          # updater refuses the download, so a missing secret should be loud.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.decide.outputs.nightly == 'true' && 'nightly' || github.ref_name }}
          releaseName: ${{ needs.decide.outputs.nightly == 'true' && 'Nightly build' || github.ref_name }}
          releaseBody: ${{ needs.decide.outputs.nightly == 'true' && format('Version {0}, built automatically from {1} on the default branch. Expect rough edges.', steps.nightly.outputs.version, steps.nightly.outputs.commit) || '' }}
          releaseDraft: false
          prerelease: ${{ needs.decide.outputs.nightly == 'true' }}
          # Tagged releases get notes generated from the commits since the last
          # tag; the nightly body is fixed, so it does not need them.
          generateReleaseNotes: ${{ needs.decide.outputs.nightly != 'true' }}
          # Publishes latest.json next to the installer, which is what the
          # in-app updater reads.
          includeUpdaterJson: true
